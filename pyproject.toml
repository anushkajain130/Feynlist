[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feynlist"
version = "1.0.0"
description = "Accountability-first day planner with AI coaching personas"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Database
    "aiosqlite>=0.20.0",

    # AI / LLM
    "google-genai>=1.5.0",

    # Async
    "asyncio-throttle>=1.0.2",

    # Data
    "pandas>=2.2.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",

    # Scheduling / Jobs
    "apscheduler>=3.10.0",

    # Logging
    "loguru>=0.7.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
gui = [
    "ttkthemes>=3.2.2",
    "tkcalendar>=1.6.1",
    "plyer>=2.1.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "analytics*", "api*", "config*", "core*", "data*", "events*", "memory*", "notifications*", "tools*"]

[tool.setuptools.package-data]
"agents.personas" = ["*.yaml"]
"data.migrations" = ["*.sql"]
